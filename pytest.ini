[pytest]
addopts = --html=artifacts/reports/report.html --self-contained-html

# Match src.logutil REPORT_LOG_FORMAT / REPORT_LOG_DATEFMT (keep in sync).
log_level = DEBUG
log_format = %(asctime)s | %(levelname)-5s | %(filename)s:%(lineno)d | %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

log_cli = true
log_cli_level = DEBUG
log_cli_format = %(asctime)s | %(levelname)-5s | %(filename)s:%(lineno)d | %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
