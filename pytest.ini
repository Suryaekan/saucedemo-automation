[pytest]
addopts = --html=artifacts/reports/report.html --self-contained-html
markers =
    inventory_page: Custom marker for tracking inventory dashboard workflows.

# Match src.logutil REPORT_LOG_FORMAT / REPORT_LOG_DATEFMT (keep in sync).
log_level = DEBUG
log_format = %(asctime)s [%(levelname)-5s] %(message)s (%(filename)s:%(lineno)d)
log_date_format = %Y-%m-%d %H:%M:%S

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)-5s] %(message)s (%(filename)s:%(lineno)d)
log_cli_date_format = %Y-%m-%d %H:%M:%S
